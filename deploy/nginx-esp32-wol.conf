# ESP32 Wake-on-LAN - nginx reverse proxy, akses langsung via IP:PORT
# Dipasang oleh install.sh ke /etc/nginx/conf.d/esp32-wol.conf
#   http://IP_VM:__HTTP_PORT__     (tanpa enkripsi)
#   https://IP_VM:__HTTPS_PORT__   (self-signed, browser kasih peringatan sekali)

limit_req_zone $binary_remote_addr zone=wol_login:1m rate=10r/m;

server {
    listen __HTTP_PORT__;
    listen [::]:__HTTP_PORT__;
    listen __HTTPS_PORT__ ssl;
    listen [::]:__HTTPS_PORT__ ssl;
    server_name _;

    ssl_certificate     /etc/esp32-wol/ssl/wol.crt;
    ssl_certificate_key /etc/esp32-wol/ssl/wol.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:wol_ssl:1m;
    ssl_session_timeout 1h;

    # akses http biasa ke port https -> arahkan ulang
    error_page 497 =301 https://$host:$server_port$request_uri;

    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /api/login {
        limit_req zone=wol_login burst=5 nodelay;
        include /etc/nginx/esp32-wol-proxy.conf;
    }

    # long-poll ESP32: koneksi ditahan sampai 20 detik
    location = /api/device/poll {
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        include /etc/nginx/esp32-wol-proxy.conf;
    }

    location / {
        include /etc/nginx/esp32-wol-proxy.conf;
    }
}
