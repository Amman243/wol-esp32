<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wake PC</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--fg:#14171c;--muted:#6b7280;--line:#e5e7eb;
  --accent:#2563eb;--accent-fg:#fff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--soft:#eef2ff;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1014;--card:#171a20;--fg:#e8eaee;--muted:#8b93a1;--line:#262a33;
  --accent:#3b82f6;--accent-fg:#fff;--ok:#22c55e;--warn:#f59e0b;--bad:#f87171;--soft:#1c2433;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:19px;margin:4px 0 16px;display:flex;align-items:center;justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:14px}
.row span:first-child{color:var(--muted)}
.row span:last-child{text-align:right;word-break:break-all}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--muted)}
.on .dot{background:var(--ok)}.off .dot{background:var(--bad)}.unk .dot{background:var(--warn)}
.big{display:flex;flex-direction:column;align-items:center;padding:22px 16px}
.wake{width:190px;height:190px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);
  font-size:24px;font-weight:700;letter-spacing:.5px;cursor:pointer;box-shadow:0 0 0 10px color-mix(in srgb,var(--accent) 18%,transparent);
  transition:transform .08s}
.wake:active{transform:scale(.96)}
.wake:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
#msg{margin-top:16px;min-height:21px;text-align:center;font-size:14px;color:var(--muted)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button.s{flex:1;min-width:120px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  color:var(--fg);font:inherit;font-size:14px;cursor:pointer}
button.s:hover{background:var(--soft)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit}
h2{font-size:14px;margin:0 0 8px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.hist{font-size:13px}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.hist div:first-child{border-top:0}
.ok{color:var(--ok)}.bad{color:var(--bad)}.pend{color:var(--warn)}
.login{max-width:340px;margin:18vh auto 0}
.login button{width:100%;margin-top:12px;padding:11px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-fg);font:inherit;font-weight:600;cursor:pointer}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}
.link{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">

  <form class="card login" id="loginView" hidden>
    <h1>Wake PC</h1>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus>
    <button type="submit">Masuk</button>
    <div class="err" id="loginErr"></div>
  </form>

  <div id="appView" hidden>
    <h1>Wake PC <button class="link" id="logout">keluar</button></h1>

    <div class="card big">
      <button class="wake" id="wakeBtn">WAKE PC</button>
      <div id="msg"></div>
    </div>

    <div class="card">
      <h2>Status</h2>
      <div class="row"><span>ESP32</span><span id="devState" class="unk"><i class="dot"></i>-</span></div>
      <div class="row"><span>PC</span><span id="pcState" class="unk"><i class="dot"></i>-</span></div>
      <div class="row"><span>MAC target</span><span id="pcMac">-</span></div>
      <div class="row"><span>IP PC</span><span id="pcIp">-</span></div>
      <div class="row"><span>IP ESP32 / WiFi</span><span id="espIp">-</span></div>
      <div class="row"><span>Uptime / RAM</span><span id="espUp">-</span></div>
      <div class="row"><span>Terakhir kontak</span><span id="seen">-</span></div>
      <div class="btns" style="margin-top:12px">
        <button class="s" data-cmd="refresh">Refresh status</button>
        <button class="s" data-cmd="reboot">Restart ESP32</button>
      </div>
    </div>

    <form class="card" id="cfgForm">
      <h2>Pengaturan target</h2>
      <label for="cMac">MAC address PC</label>
      <input id="cMac" placeholder="AA:BB:CC:DD:EE:FF" required>
      <label for="cIp">IP PC (buat cek online, boleh kosong)</label>
      <input id="cIp" placeholder="192.168.0.108">
      <label for="cBc">Broadcast</label>
      <input id="cBc" placeholder="192.168.0.255">
      <div class="btns" style="margin-top:12px"><button class="s" type="submit">Simpan ke ESP32</button></div>
    </form>

    <div class="card">
      <h2>Riwayat</h2>
      <div class="hist" id="hist"><div><span style="color:var(--muted)">belum ada</span></div></div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let last = null, cfgFilled = false, timer = null;

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, credentials: "same-origin", ...opts });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== "/api/login") { showLogin(); throw new Error("login"); }
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

function showLogin() { clearInterval(timer); $("appView").hidden = true; $("loginView").hidden = false; $("pw").focus(); }
function showApp() { $("loginView").hidden = true; $("appView").hidden = false; refresh(); clearInterval(timer); timer = setInterval(refresh, 2000); }

function setState(el, cls, text) { el.className = cls; el.innerHTML = '<i class="dot"></i>' + text; }
function ago(ms) {
  if (!ms) return "-";
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 60) return s + " dtk lalu";
  if (s < 3600) return Math.round(s / 60) + " mnt lalu";
  return Math.round(s / 3600) + " jam lalu";
}
function dur(s) {
  if (s == null) return "-";
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? h + "j " + m + "m" : m + "m " + (s % 60) + "d";
}
const NAMES = { wake: "Wake PC", reboot: "Restart ESP32", config: "Simpan pengaturan", refresh: "Refresh status" };

async function refresh() {
  try { last = await api("/api/state"); } catch { return; }
  const d = last.device, s = d.status || {};
  setState($("devState"), d.online ? "on" : "off", d.online ? "Online" : "Offline");
  if (!d.online || s.pc_online == null) setState($("pcState"), "unk", d.online ? "tidak dicek" : "tidak diketahui");
  else setState($("pcState"), s.pc_online ? "on" : "off", s.pc_online ? "Nyala" : "Mati / tidak merespon");
  $("wakeBtn").disabled = !d.online;
  $("pcMac").textContent = s.pc_mac || "-";
  $("pcIp").textContent = s.pc_ip || "-";
  $("espIp").textContent = s.ip ? s.ip + (s.rssi != null ? " · " + s.rssi + " dBm" : "") : "-";
  $("espUp").textContent = s.uptime_s != null ? dur(s.uptime_s) + " · " + Math.round((s.free_mem || 0) / 1024) + " KB" : "-";
  $("seen").textContent = ago(d.last_seen);
  if (!cfgFilled && s.pc_mac) {
    $("cMac").value = s.pc_mac; $("cIp").value = s.pc_ip || ""; $("cBc").value = s.broadcast || "";
    cfgFilled = true;
  }
  const h = last.history;
  $("hist").innerHTML = h.length ? h.map((c) => {
    const st = c.done ? (c.ok ? '<span class="ok">OK</span>' : '<span class="bad">gagal</span>')
      : c.sent ? '<span class="pend">dikirim…</span>' : '<span class="pend">antri…</span>';
    const t = new Date(c.created).toLocaleString("id-ID", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
    return `<div><span>${NAMES[c.type] || c.type}<br><small style="color:var(--muted)">${t}${c.msg ? " · " + esc(c.msg) : ""}</small></span>${st}</div>`;
  }).join("") : '<div><span style="color:var(--muted)">belum ada</span></div>';
}
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

async function send(type, data) {
  try {
    const r = await api("/api/command", { method: "POST", body: JSON.stringify({ type, data }) });
    $("msg").textContent = r.device_online ? NAMES[type] + ": dikirim ke ESP32…" : "ESP32 offline, command diantrikan 60 detik";
    refresh();
    return r;
  } catch (e) { if (e.message !== "login") $("msg").textContent = "Error: " + e.message; }
}

$("wakeBtn").onclick = async () => {
  $("wakeBtn").disabled = true;
  await send("wake");
  setTimeout(() => { $("wakeBtn").disabled = !(last && last.device.online); }, 2500);
};
document.querySelectorAll("[data-cmd]").forEach((b) => b.onclick = () => {
  if (b.dataset.cmd === "reboot" && !confirm("Restart ESP32?")) return;
  send(b.dataset.cmd);
});
$("cfgForm").onsubmit = (e) => {
  e.preventDefault();
  send("config", { pc_mac: $("cMac").value.trim(), pc_ip: $("cIp").value.trim(), broadcast: $("cBc").value.trim() });
  cfgFilled = false;
};
$("loginView").onsubmit = async (e) => {
  e.preventDefault();
  $("loginErr").textContent = "";
  try { await api("/api/login", { method: "POST", body: JSON.stringify({ password: $("pw").value }) }); $("pw").value = ""; showApp(); }
  catch (err) { $("loginErr").textContent = err.message; }
};
$("logout").onclick = async () => { await api("/api/logout", { method: "POST" }).catch(() => {}); showLogin(); };

api("/api/state").then(showApp).catch(() => {});
</script>
</body>
</html>
